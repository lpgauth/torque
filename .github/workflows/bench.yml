name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

env:
  MIX_ENV: bench
  TORQUE_BUILD: true

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Mix deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: bench-mix-${{ hashFiles('mix.lock') }}
          restore-keys: bench-mix-

      # The instrumented and PGO builds below use target-cpu=native, and
      # without --target cargo applies RUSTFLAGS to proc macros too. A cached
      # proc-macro .so compiled on a runner with a wider instruction set makes
      # rustc die with SIGILL when it loads it, so the CPU model is part of the
      # cache key. It has to go in `shared-key`, not `key`: rust-cache appends
      # `key` only when `shared-key` is unset, so setting both silently drops
      # `key` from the cache key.
      - name: Read runner CPU model
        id: cpu
        run: echo "model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | tr -c 'A-Za-z0-9\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-bench
          shared-key: x86_64-unknown-linux-gnu-${{ steps.cpu.outputs.model }}

      - name: Install dependencies
        run: mix deps.get

      # PGO pass 1: build torque instrumented and run a representative workload
      # to emit profile data. RUSTFLAGS replaces (not appends to) the crate's
      # .cargo/config.toml, so target-cpu=native is carried through here.
      # --force is required: mix keys compile staleness off file mtimes, not the
      # RUSTFLAGS env var, so without it a cached build is reused and cargo is
      # never invoked (instrumented .so is never built -> no .profraw).
      - name: Build instrumented torque & collect PGO profile
        env:
          RUSTFLAGS: "-C target-cpu=native -Cprofile-generate=${{ github.workspace }}/pgo-data"
          LLVM_PROFILE_FILE: "${{ github.workspace }}/pgo-data/torque-%p-%m.profraw"
        run: |
          mkdir -p pgo-data
          mix compile --force
          mix run bench/pgo_workload.exs

      - name: Merge PGO profile data
        run: |
          shopt -s nullglob
          raw=(pgo-data/*.profraw)
          if [ ${#raw[@]} -eq 0 ]; then
            echo "::error::no .profraw files produced by the PGO workload"
            exit 1
          fi
          host="$(rustc -vV | sed -n 's/^host: //p')"
          profdata="$(rustc --print sysroot)/lib/rustlib/${host}/bin/llvm-profdata"
          if [ ! -x "$profdata" ]; then
            echo "::error::llvm-profdata not found at $profdata (is the llvm-tools-preview component installed?)"
            exit 1
          fi
          "$profdata" merge -o pgo-data/merged.profdata "${raw[@]}"
          ls -la pgo-data

      # PGO the comparison library too, so the benchmark is PGO-vs-PGO instead
      # of PGO-torque-vs-plain-glazer. glazer's `make OPTIMIZE=1` target drives
      # PGO from bin/pgo-profile.es, which the hex package doesn't ship, so we
      # drive its c_src Makefile's PGO=generate/use directly with the same
      # payloads the torque pass uses (bench/glazer_pgo_workload.exs). The
      # runtime loads deps/glazer/priv/glazer.so (the _build app priv dir is a
      # symlink to it), so rebuilding there is what the benchmark picks up.
      # CI's g++ is GCC: it writes .gcda and reads them back from the profile
      # dir on -fprofile-use with no separate merge step. A later
      # `mix compile --force` only forces torque, not the glazer dep, so this
      # optimised .so survives into the benchmark step.
      - name: Build instrumented glazer & collect PGO profile
        run: |
          make -C deps/glazer/c_src PGO=generate clean all
          mix run bench/glazer_pgo_workload.exs

      - name: Rebuild glazer with PGO profile
        run: make -C deps/glazer/c_src PGO=use all

      # PGO pass 2: rebuild torque with the collected profile, then benchmark.
      # --force is mandatory here: mix does not treat a changed RUSTFLAGS as a
      # reason to recompile, so a plain `mix compile` is a no-op and the
      # benchmark would run the *instrumented* binary from pass 1 (slow, ~20%
      # off). --force re-invokes cargo, which rebuilds against merged.profdata.
      - name: Run benchmarks (PGO build)
        env:
          RUSTFLAGS: "-C target-cpu=native -Cprofile-use=${{ github.workspace }}/pgo-data/merged.profdata"
          BENCH_OUTPUT: json
        run: |
          mix compile --force
          mix run bench/torque_bench.exs

      - name: Store trend data
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Torque Benchmarks
          tool: customBiggerIsBetter
          output-file-path: bench_torque.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: dev/bench
          comment-on-alert: true
          alert-threshold: "130%"
          fail-on-alert: false

      - name: Deploy comparison data and custom page
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages -B gh-pages origin/gh-pages
          mkdir -p /tmp/gh-pages/dev/bench
          cp bench_comparison.json /tmp/gh-pages/dev/bench/comparison.json
          cp bench/index.html /tmp/gh-pages/dev/bench/index.html
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dev/bench/comparison.json dev/bench/index.html
          if ! git diff --staged --quiet; then
            git commit -m "Update comparison data and benchmark page"
            git push origin gh-pages
          fi

      - name: Upload raw results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench_torque.json
            bench_comparison.json
          retention-days: 90
