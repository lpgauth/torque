name: Build precompiled NIFs

on:
  push:
    tags:
      - "v*"
  # Manual build-only run for validating the workflow (incl. PGO) without
  # cutting a release: create/upload steps are gated on a tag, so a dispatch
  # builds every target but publishes nothing.
  workflow_dispatch:

jobs:
  create_release:
    name: Create GitHub release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --draft

  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }}${{ matrix.job.variant && format(' ({0})', matrix.job.variant) || '' }}
    needs: create_release
    runs-on: ${{ matrix.job.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        # pgo: true is set only where the runner can natively run the
        # instrumented NIF to collect a profile (runner arch == target arch).
        # Cross-compiled targets build plain -O3 (no native runner to profile on).
        job:
          - { target: aarch64-apple-darwin,        os: macos-15,     pgo: true }
          - { target: aarch64-unknown-linux-gnu,   os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-apple-darwin,         os: macos-15,     rustflags: "-C target-cpu=x86-64" }
          - { target: x86_64-apple-darwin,         os: macos-15,     rustflags: "-C target-cpu=x86-64-v2", variant: v2 }
          - { target: x86_64-apple-darwin,         os: macos-15,     rustflags: "-C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq", variant: v3 }
          - { target: x86_64-unknown-linux-gnu,    os: ubuntu-22.04, rustflags: "-C target-cpu=x86-64",    pgo: true }
          - { target: x86_64-unknown-linux-gnu,    os: ubuntu-22.04, rustflags: "-C target-cpu=x86-64-v2", variant: v2, pgo: true }
          - { target: x86_64-unknown-linux-gnu,    os: ubuntu-22.04, rustflags: "-C target-cpu=x86-64-v3 -C target-feature=+pclmulqdq", variant: v3, pgo: true }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Extract project version
        shell: bash
        run: |
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.job.target }}
          # llvm-tools-preview provides the version-matched llvm-profdata used to
          # merge the PGO profile (no-op for non-PGO jobs).
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-precomp
          shared-key: ${{ matrix.job.target }}-${{ matrix.nif }}-${{ matrix.job.variant || 'base' }}

      - name: Install cross
        if: matrix.job.use-cross
        shell: bash
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Set up Elixir for PGO profiling
        if: matrix.job.pgo
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Collect PGO profile
        if: matrix.job.pgo
        shell: bash
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          export TORQUE_BUILD=true
          PGO_DIR="$PWD/pgo"
          rm -rf "$PGO_DIR"; mkdir -p "$PGO_DIR"
          mix deps.get
          # Build an instrumented NIF and exercise it through the BEAM to
          # collect a same-arch profile. The workload has no external deps, so
          # a bare mix env suffices.
          RUSTFLAGS="-Cprofile-generate=$PGO_DIR" mix compile
          # Profile the artifact the next step ships: same `cargo build
          # --target` (cargo hashes the target into symbol names) and same
          # target-cpu (sonic-rs picks its AVX2 code at compile time, so a
          # generic build profiles different functions than v3 ships).
          RUSTFLAGS="${{ matrix.job.rustflags }}"
          case "$RUSTFLAGS" in
            # Same flag sets as rebar/fetch_nif.escript.
            *x86-64-v3*) NEED="pni ssse3 sse4_1 sse4_2 popcnt cx16 lahf_lm avx avx2 bmi1 bmi2 f16c fma abm movbe pclmulqdq" ;;
            *x86-64-v2*) NEED="pni ssse3 sse4_1 sse4_2 popcnt cx16 lahf_lm" ;;
            *) NEED="" ;;
          esac
          for f in $NEED; do
            grep -qw "$f" /proc/cpuinfo || { echo "::error::runner lacks $f, cannot run the instrumented NIF"; exit 1; }
          done
          RUSTLER_NIF_VERSION=${{ matrix.nif }} RUSTFLAGS="$RUSTFLAGS -Cprofile-generate=$PGO_DIR" \
            cargo build --release --target ${{ matrix.job.target }} --package torque_nif
          EXT=so; [[ "${{ matrix.job.target }}" == *darwin* ]] && EXT=dylib
          cp "target/${{ matrix.job.target }}/release/libtorque_nif.$EXT" priv/native/torque_nif.so
          mix run --no-compile bench/pgo_workload.exs
          # Merge with the toolchain's version-matched llvm-profdata.
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          PROFDATA="$(rustc --print sysroot)/lib/rustlib/${HOST}/bin/llvm-profdata"
          if [ ! -x "$PROFDATA" ]; then
            echo "::error::llvm-profdata not found at $PROFDATA (is the llvm-tools-preview component installed?)"
            exit 1
          fi
          "$PROFDATA" merge -o "$PGO_DIR/merged.profdata" "$PGO_DIR"/*.profraw
          echo "PGO_FLAGS=-Cprofile-use=$PGO_DIR/merged.profdata" >> "$GITHUB_ENV"
          echo "::notice::Collected PGO profile for ${{ matrix.job.target }}${{ matrix.job.variant && format(' ({0})', matrix.job.variant) || '' }}"

      - name: Build native library
        shell: bash
        run: |
          set -euo pipefail
          FLAGS="${{ matrix.job.rustflags }}"
          if [ -n "${PGO_FLAGS:-}" ]; then
            FLAGS="$FLAGS ${PGO_FLAGS}"
            echo "Building ${{ matrix.job.target }} with PGO"
          else
            echo "Building ${{ matrix.job.target }} without PGO"
          fi
          if [ -n "${PGO_FLAGS:-}" ]; then
            FLAGS="$FLAGS -Cllvm-args=-pgo-warn-missing-function"
          fi
          if [ -n "$FLAGS" ]; then export RUSTFLAGS="$FLAGS"; fi
          if [ "${{ matrix.job.use-cross }}" = "true" ]; then
            RUSTLER_NIF_VERSION=${{ matrix.nif }} cross build --release --target ${{ matrix.job.target }} --package torque_nif
          else
            RUSTLER_NIF_VERSION=${{ matrix.nif }} cargo build --release --target ${{ matrix.job.target }} --package torque_nif 2>&1 | tee build.log
          fi
          if [ -n "${PGO_FLAGS:-}" ]; then
            MISSES=$(grep -c "no profile data available" build.log || true)
            echo "::notice::PGO: ${MISSES} functions without profile data (${{ matrix.job.target }}${{ matrix.job.variant && format(' {0}', matrix.job.variant) || '' }})"
          fi

      # Runs the suite against the exact library this job ships. Only the PGO
      # jobs can: their runner matches the target and already has Elixir. The
      # compile builds a throwaway NIF (the draft release has nothing to
      # download yet), which the shipped one then replaces.
      - name: Test the built library
        if: matrix.job.pgo
        shell: bash
        run: |
          set -euo pipefail
          export TORQUE_BUILD=true MIX_ENV=test
          mix deps.get
          mix compile
          EXT=so; [[ "${{ matrix.job.target }}" == *darwin* ]] && EXT=dylib
          cp "target/${{ matrix.job.target }}/release/libtorque_nif.$EXT" priv/native/torque_nif.so
          mix test --no-compile

      - name: Package artifact
        shell: bash
        run: |
          TARGET=${{ matrix.job.target }}
          VERSION=${{ env.PROJECT_VERSION }}
          NIF=${{ matrix.nif }}

          if [[ "$TARGET" == *"darwin"* ]]; then
            LIB_FILE="target/${TARGET}/release/libtorque_nif.dylib"
          else
            LIB_FILE="target/${TARGET}/release/libtorque_nif.so"
          fi

          # rebar/fetch_nif.escript expects the file inside the archive to match this name
          VARIANT="${{ matrix.job.variant }}"
          NIF_NAME="libtorque_nif-v${VERSION}-nif-${NIF}-${TARGET}"
          if [ -n "${VARIANT}" ]; then
            NIF_NAME="${NIF_NAME}--${VARIANT}"
          fi
          NIF_NAME="${NIF_NAME}.so"
          cp "${LIB_FILE}" "${NIF_NAME}"

          ARCHIVE_NAME="${NIF_NAME}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" "${NIF_NAME}"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.ARCHIVE_NAME }}" --clobber
