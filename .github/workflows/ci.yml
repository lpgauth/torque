name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  TORQUE_BUILD: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p torque_nif

  test:
    name: Test (${{ matrix.os }}, OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            otp: "28"
            elixir: "1.18"
          - os: ubuntu-latest
            otp: "27"
            elixir: "1.18"
          # The oldest versions mix.exs allows. Pinned: setup-beam has no
          # OTP 24 for Ubuntu releases after 24.04.
          - os: ubuntu-24.04
            otp: "24"
            elixir: "1.15"
          # Apple Silicon: the NEON escape kernels and parser paths.
          - os: macos-15
            otp: "28"
            elixir: "1.18"
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: dtolnay/rust-toolchain@stable

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
      - if: runner.os == 'macOS'
        run: cargo test -p torque_nif

  dialyzer:
    name: Dialyzer, docs and package
    runs-on: ubuntu-latest
    env:
      # dialyxir and ex_doc are :dev-only dependencies.
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "28"
          elixir-version: "1.18"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.mix/dialyxir_*.plt
            _build/dev/dialyxir_*.plt
            _build/dev/dialyxir_*.plt.hash
          key: plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - run: mix dialyzer
      - run: mix docs --warnings-as-errors
      - run: mix hex.build

  rebar3:
    name: rebar3 (OTP 28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.x"

      - uses: dtolnay/rust-toolchain@stable

      # TORQUE_BUILD=true (workflow env): the NIF is built with cargo.
      - run: rebar3 eunit

      # The download path, against the release in the shipped checksum file. A
      # published binary only loads into a build of the same NIF sources, so
      # this stops at a verified install.
      - name: Fetch a published NIF
        env:
          TORQUE_BUILD: ""
        run: |
          VSN=$(sed -n 's/.*libtorque_nif-v\([0-9.]*\)-nif-.*/\1/p' checksums.txt | head -n1)
          rm -f priv/native/torque_nif.so
          TORQUE_NIF_VSN="$VSN" escript rebar/fetch_nif.escript
          test -s priv/native/torque_nif.so
